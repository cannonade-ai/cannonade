appId: app.cannonade
productName: Cannonade
directories:
  buildResources: build
files:
  - '!dist/**'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!node_modules/onnxruntime-web/**'
asarUnpack:
  - resources/**
win:
  executableName: Cannonade
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/{darwin,linux}/**'
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/{win32,linux}/**'
  category: public.app-category.developer-tools
  identity: '-'
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Cannonade needs access to your Documents folder to import and export test suites.
    - NSDownloadsFolderUsageDescription: Cannonade needs access to your Downloads folder to import and export test suites.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/{win32,darwin}/**'
  target:
    - AppImage
    - deb
  maintainer: Cannonade <https://cannonade.app>
  category: Development
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: cannonade-ai
  repo: cannonade
