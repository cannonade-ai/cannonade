appId: app.cannonade
productName: Cannonade
directories:
  buildResources: build
files:
  - 'out/**'
  - 'resources/**'
  - 'package.json'
  - '!node_modules/onnxruntime-web/**'
asarUnpack:
  - resources/**
win:
  executableName: Cannonade
  files:
    - 'out/**'
    - 'resources/**'
    - 'package.json'
    - '!node_modules/onnxruntime-web/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/{darwin,linux}/**'
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  files:
    - 'out/**'
    - 'resources/**'
    - 'package.json'
    - '!node_modules/onnxruntime-web/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/{win32,linux}/**'
  category: public.app-category.developer-tools
  identity: '-'
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Cannonade needs access to your Documents folder to import and export test suites.
    - NSDownloadsFolderUsageDescription: Cannonade needs access to your Downloads folder to import and export test suites.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  files:
    - 'out/**'
    - 'resources/**'
    - 'package.json'
    - '!node_modules/onnxruntime-web/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/{win32,darwin}/**'
  target:
    - AppImage
    - deb
  maintainer: Cannonade <https://cannonade.app>
  category: Development
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: cannonade-ai
  repo: cannonade
