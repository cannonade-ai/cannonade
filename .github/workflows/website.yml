name: Website CI

on:
  push:
    branches: [ "main" ]
    paths: [ "website/**", ".github/workflows/website.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "website/**", ".github/workflows/website.yml" ]

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: website/package-lock.json
    - run: npm ci
    - run: npm run build
